#285b49}#mata .symbol{background:white;color:#111;border:1px solid #d4dad2;min-height:240px;display:grid;place-items:center}#mata .symbol b{font:700 140px/1 Arial}#mata .pad{display:grid;grid-template-columns:repeat(3,60px);gap:8px}#mata .pad button{font-size:22px}#mata .results{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid #d4dad2;margin:28px 0}#mata .results div{padding:22px 8px}#mata .results strong{display:block;font-size:22px;font-weight:400}#mata details,#mata footer{padding:18px 28px;border-top:1px solid #d4dad2}#mata details{background:#e5e9e1}#mata summary{cursor:pointer}#mata li{margin:10px 0}#mata [hidden]{display:none!important}@media(max-width:650px){#mata .grid,#mata .results{grid-template-columns:1fr}#mata main,#mata header{padding:24px 20px}#mata h1{font-size:34px}#mata header{flex-wrap:wrap}}

</style></head><body><div id="mata"><header><span class="brand">matacheck.</span><div class="header-actions"><small>PROTOTIPE &middot; BUKAN PEMERIKSAAN MATA</small><button id="clear-session" hidden>Hapus sesi &amp; mulai ulang</button></div></header><main aria-label="Simulasi MataCheck"></main><footer><small>Tanpa akun &middot; Kamera tidak aktif &middot; Refresh atau tutup tab untuk menghapus sesi.</small></footer><noscript>Aktifkan JavaScript untuk mencoba simulasi. Prototipe ini tidak melakukan pemeriksaan mata.</noscript></div><script>
(()=>{const root=document.getElementById('mata'),main=root.querySelector('main');let page=0,q=0,ready=false,paused=false,answers=[[],[]];const names=['Beranda','Pemeriksaan awal','Persiapan','Mata kanan','Mata kiri','Ringkasan','Latihan menjawab','Jeda pergantian mata'];
const steps=[1,2,6,3,7,4,5];
const formState={condition:null,consent:false,mode:null,setup:[false,false],practiced:false,switched:false};
const action=(n,t,primary=true)=>`<button class="${primary?'primary':''}" data-go="${n}">${t}</button>`;
function canEnter(n){if(!Number.isInteger(n)||n<0||n>7)return false;if(n<=1)return true;if(formState.condition!=='no'||!formState.consent)return false;if(n===2)return true;if(!['solo','helper'].includes(formState.mode)||!formState.setup.every(Boolean))return false;if(n===6)return true;if(!formState.practiced)return false;if(n===3)return true;if(answers[0].length!==3)return false;if(n===7)return true;if(!formState.switched)return false;if(n===4)return true;return answers[1].length===3;}
function go(n){if(!canEnter(n))return;if((page===3||page===4)&&ready&&q<3)answers[page-3]=[];page=n;q=0;ready=false;paused=false;render();main.querySelector("h1")?.focus({preventScroll:true})}
const solo=()=>formState.mode==='solo';
const keyboardHelp='Panah: arah E. N: Tidak terlihat. P: Jeda atau lanjutkan. Lepaskan tombol sebelum menjawab lagi.';
function render(){root.dataset.screen=String(page);root.querySelector('#clear-session').hidden=page===0;
if(page===0)main.innerHTML=`<div class="grid"><section><div class="kicker">Satu langkah, satu instruksi</div><h1 tabindex="-1">Kenali alurnya.<br>Pelan-pelan,<br>satu mata dulu.</h1><p>Coba sendiri dengan keyboard atau bersama pendamping yang memasukkan jawabanmu. Latihan dulu, lalu tiga respons untuk setiap mata. Di akhir, lihat catatan jawaban sesi ini.</p>${action(1,'Mulai simulasi →')}<p class="muted smallprint">Demonstrasi alur. Tidak mengukur minus, plus, atau silinder.</p></section><aside><div class="poster" aria-hidden="true"><div class="poster-title">LIHAT &middot; SEBUTKAN &middot; LANJUTKAN</div><div class="letter">E</div><div class="letter-row">E E E</div><div class="poster-caption">Ilustrasi simbol &mdash; bukan alat ukur</div></div><div class="prep-list"><h2>Yang perlu kamu siapkan</h2><div class="row">01 &nbsp; Gunakan laptop atau komputer</div><div class="row">02 &nbsp; Pilih sendiri atau dengan pendamping</div><div class="row">03 &nbsp; Ikuti instruksi bergantian</div></div></aside></div>`;
if(page===1)main.innerHTML=`<div class="kicker">01 / Sebelum mulai</div><h1 tabindex="-1">Periksa kesiapanmu.</h1><p>Pilih kondisi untuk mencoba alur prototipe.</p><fieldset style="border:0;padding:0"><legend>Ada keluhan mendadak atau cedera mata?</legend><label class="check"><input type="radio" name="condition" value="no">Tidak, lanjut mencoba simulasi</label><label class="check"><input type="radio" name="condition" value="yes">Ya, atau saya tidak yakin</label></fieldset><div id="stop" role="alert" class="note" hidden>Hentikan tes mandiri. Jangan gunakan simulasi untuk menilai keluhan; cari bantuan tenaga medis.</div><label class="check"><input id="consent" type="checkbox">Saya memahami bahwa ini simulasi, bukan ukuran kacamata atau pemeriksaan kesehatan mata.</label><div class="actions">${action(0,'Kembali',false)}<button class="primary" id="next" data-go="2" disabled>Lanjut ke persiapan →</button></div>`;
if(page===2)main.innerHTML=`<div class="kicker">02 / Persiapan</div><h1 tabindex="-1">Atur tempatmu dulu.</h1><fieldset><legend>Bagaimana kamu ingin mencoba?</legend><label class="check"><input type="radio" name="mode" value="solo">Coba sendiri</label><label class="check"><input type="radio" name="mode" value="helper">Dengan pendamping</label></fieldset><div class="grid"><section><h2>${solo()?'Lihat dan jawab sendiri.':'Laptop untuk melihat. Pendamping untuk menjawab.'}</h2><p>Letakkan laptop dengan stabil. ${solo()?'Kenali tombol panah sebelum menutup satu mata.':'Pendamping memasukkan arah yang kamu sebutkan.'}</p><label class="check"><input class="setup" type="checkbox">Laptop siap dan layar terlihat tanpa pantulan mengganggu.</label><label class="check"><input class="setup" type="checkbox">${solo()?'Saya siap menggunakan keyboard atau tombol layar sendiri.':'Pendamping siap memasukkan jawaban.'}</label></section><aside><h2>${solo()?'Cara mencoba sendiri':'Siapa melakukan apa?'}</h2>${solo()?'<p>Lihat simbol dan masukkan arah kaki E. Gunakan satu tangan untuk menutup mata tanpa menekannya dan tangan lain untuk menjawab. Buka kembali mata atau berhenti jika posisi tidak nyaman.</p><p>'+keyboardHelp+'</p>':'<ol><li><strong>Peserta:</strong> duduk menghadap layar dan sebutkan arah kaki huruf E.</li><li><strong>Pendamping:</strong> baca instruksi, lalu klik jawaban yang disebutkan peserta.</li><li>Jika perlu berhenti, gunakan tombol Jeda.</li></ol>'}</aside></div><div class="note">Tidak perlu mundur ke jarak tertentu pada demo ini. Jarak dan kalibrasi harus ditetapkan sebelum tes sungguhan.</div><div class="actions">${action(1,'Kembali',false)}<button id="next" class="primary" data-go="6" disabled>Coba latihan menjawab →</button></div>`;

if(page===6)main.innerHTML=`<div class="kicker">${solo()?'Latihan sendiri':'Latihan bersama pendamping'}</div><h1 tabindex="-1">Kenali arah kaki huruf E.</h1><p>Kaki adalah tiga garis pendek pada huruf E. Pada contoh ini, semuanya mengarah ke <strong>kanan</strong>. Kedua mata boleh terbuka saat latihan.</p><div class="grid"><section><div class="symbol" aria-label="Contoh huruf E dengan kaki ke kanan"><b aria-hidden="true">E</b></div><p>${solo()?'Tekan panah kanan pada keyboard, atau klik tombol Kanan.':'Peserta menyebut kanan. Pendamping menekan tombol Kanan.'}</p></section><aside><h2>Coba masukkan jawaban</h2><div class="actions">${['Atas','Kiri','Kanan','Bawah'].map(t=>'<button data-practice="'+t.toLowerCase()+'">'+t+'</button>').join('')}</div><p id="practice-feedback" role="status">${formState.practiced?'Latihan selesai. Jawaban latihan tidak masuk catatan sesi.':'Latihan ini menjelaskan tombol, bukan menilai penglihatan.'}</p></aside></div><div class="actions">${action(2,'Kembali ke persiapan',false)}<button id="next" class="primary" data-go="3" ${formState.practiced?'':'disabled'}>Siapkan mata kanan →</button></div>`;
if(page===7)main.innerHTML=`<div class="kicker">Mata kanan selesai</div><h1 tabindex="-1">Jeda dulu, lalu ganti mata.</h1><p>Tiga respons mata kanan sudah dicatat. Beristirahatlah sebelum melanjutkan.</p><ol><li>Buka kembali mata kiri.</li><li>Tutup mata kanan dengan lembut tanpa menekannya.</li><li>Biarkan mata kiri terbuka untuk demo berikutnya.</li></ol><label class="check"><input id="switch-eye" type="checkbox" ${formState.switched?'checked':''}>Peserta siap: mata kanan tertutup, mata kiri terbuka.</label><div class="actions"><button id="next" class="primary" data-go="4" ${formState.switched?'':'disabled'}>Lanjut ke mata kiri →</button></div>`;

if(page===3||page===4){const eye=page===3?'kanan':'kiri',closed=page===3?'kiri':'kanan';if(!ready)main.innerHTML=`<div class="kicker">Demo mata ${eye}</div><h1 tabindex="-1">Sekarang, mata ${eye}.</h1><p>Tutup mata ${closed} dengan lembut, tanpa menekannya. Biarkan mata ${eye} terbuka.</p><div class="eye-guide" role="img" aria-label="Panduan dari sisi peserta: mata ${closed} ditutup, mata ${eye} terbuka"><span><svg viewBox="0 0 100 60" aria-hidden="true"><path d="M10 30Q50 60 90 30M25 40L20 50M50 46V57M75 40L80 50"/></svg>Mata ${closed}<strong>DITUTUP</strong></span><span><svg viewBox="0 0 100 60" aria-hidden="true"><path d="M10 30Q50 -5 90 30Q50 65 10 30Z"/><circle cx="50" cy="30" r="12"/></svg>Mata ${eye}<strong>TERBUKA</strong></span></div><aside><h2>${solo()?'Untuk kamu':'Untuk pendamping'}</h2><p>${solo()?keyboardHelp:'Minta peserta menyebutkan arah kaki huruf E. Masukkan jawaban tanpa petunjuk. Pilih Tidak terlihat jika peserta tidak dapat menyebutkan arahnya.'}</p></aside><div class="actions">${action(2,'Kembali ke persiapan',false)}<button class="primary" id="ready">Siap, mulai demo →</button></div>`;else main.innerHTML=`<div class="kicker">Mata ${eye} · Percobaan ${q+1} dari 3 · Simulasi</div><h1 tabindex="-1">Ke arah mana?</h1><div class="grid"><section><div class="symbol">${paused?'Sesi dijeda':`<b style="transform:rotate(${[0,90,270][q]}deg)">E</b>`}</div><p class="muted">${paused?'Simbol disembunyikan sampai sesi dilanjutkan.':`Mata ${closed} tertutup. Sebutkan arah kaki huruf E.`}</p></section><aside><h2>${solo()?'Masukkan jawabanmu':'Pendamping: masukkan jawaban'}</h2><div class="pad"><span></span><button data-answer="atas" aria-label="Atas" ${paused?'disabled':''}>↑</button><span></span><button data-answer="kiri" aria-label="Kiri" ${paused?'disabled':''}>←</button><span></span><button data-answer="kanan" aria-label="Kanan" ${paused?'disabled':''}>→</button><span></span><button data-answer="bawah" aria-label="Bawah" ${paused?'disabled':''}>↓</button></div><div class="actions"><button data-answer="tidak terlihat" ${paused?'disabled':''}>Tidak terlihat</button><button id="pause">${paused?'Lanjutkan':'Jeda'}</button></div></aside></div>`}
if(page===5)main.innerHTML=`<div class="kicker">Sesi selesai / Ringkasan simulasi</div><h1 tabindex="-1">Catatan percobaanmu.</h1><p>Kedua mata sudah menyelesaikan demo. Mode ${solo()?'coba sendiri':'dengan pendamping'}. Berikut jawaban yang dicatat, sesuai urutan percobaan. Latihan awal tidak disertakan.</p><div class="results" aria-live="polite"><div>Mata kanan<strong>${answers[0].length?answers[0].length+' dari 3 respons':'Belum dicoba'}</strong></div><div>Mata kiri<strong>${answers[1].length?answers[1].length+' dari 3 respons':'Belum dicoba'}</strong></div></div><div class="grid response-log">${answers.map((list,i)=>`<section><h2>Catatan mata ${i===0?'kanan':'kiri'}</h2><ol>${list.map(a=>`<li>${a.charAt(0).toUpperCase()+a.slice(1)}</li>`).join('')}</ol></section>`).join('')}</div><div class="note">Tidak ada kesimpulan kondisi mata. Prototipe ini tidak menghasilkan ukuran minus, plus, silinder, atau resep.</div><p class="muted">Ukuran kacamata memerlukan pemeriksaan refraksi oleh tenaga profesional.</p><div class="actions"><button class="primary" id="restart">Ulangi simulasi</button>${action(0,'Kembali ke beranda',false)}</div>`;

if(page===1){const r=main.querySelector('[name=condition][value="'+formState.condition+'"]');if(r)r.checked=true;main.querySelector('#consent').checked=formState.consent;main.querySelector('#stop').hidden=formState.condition!=='yes';main.querySelector('#next').disabled=!(formState.condition==='no'&&formState.consent);main.insertAdjacentHTML('beforeend','<p class="helper">Untuk melanjutkan, pilih kondisi tanpa keluhan mendadak dan centang pernyataan pemahaman.</p>');}
if(page===2){main.querySelectorAll('.setup').forEach((c,i)=>c.checked=formState.setup[i]);main.querySelectorAll('[name=mode]').forEach(c=>c.checked=c.value===formState.mode);main.querySelector('#next').disabled=!canEnter(6);main.insertAdjacentHTML('beforeend','<p class="helper">Centang kedua persiapan untuk mengaktifkan tombol lanjut. Pilih mode dan selesaikan persiapan, lalu coba satu contoh.</p>');}
main.querySelectorAll('.pad button').forEach(b=>{b.insertAdjacentHTML('beforeend','<span>'+b.getAttribute('aria-label')+'</span>')});
if(solo()&&((page===3||page===4)&&ready||page===6))main.insertAdjacentHTML('beforeend','<p class="helper">'+keyboardHelp+'</p>');
const step=steps.indexOf(page)+1;
if(page>0)main.insertAdjacentHTML('afterbegin','<div class="step-label"><span>Langkah '+step+' dari 7</span><span>'+names[page]+'</span></div><div class="session-line" aria-label="Langkah '+step+' dari 7">'+[1,2,3,4,5,6,7].map(i=>'<span class="'+(i<=step?'done':'')+'"></span>').join('')+'</div>');
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='clear-session'){answers=[[],[]];formState.condition=null;formState.consent=false;formState.mode=null;formState.setup=[false,false];formState.practiced=false;formState.switched=false;go(0);return;}if(b.dataset.go!==undefined)return go(+b.dataset.go);if(b.dataset.practice&&page===6){if(b.dataset.practice==='kanan'){formState.practiced=true;main.querySelector('#next').disabled=false;main.querySelector('#practice-feedback').textContent='Benar untuk contoh ini: kaki huruf E mengarah ke kanan. Latihan selesai; lanjutkan saat siap.';}else{main.querySelector('#practice-feedback').textContent='Coba lagi: tiga garis pendek pada contoh ini mengarah ke kanan. Pilih tombol Kanan.';}return;}if(b.id==='ready'){ready=true;answers[page-3]=[];if(page===3){answers[1]=[];formState.switched=false;}render();main.querySelector('h1')?.focus()}if(b.id==='pause'){paused=!paused;render();main.querySelector('#pause')?.focus()}if(b.dataset.answer&&!paused&&ready&&(page===3||page===4)&&q<3){answers[page-3].push(b.dataset.answer);q++;if(q===3)go(page===3?7:5);else {render();main.querySelector('[data-answer="'+b.dataset.answer+'"]')?.focus()}}if(b.id==='restart'){answers=[[],[]];formState.condition=null;formState.consent=false;formState.mode=null;formState.setup=[false,false];formState.practiced=false;formState.switched=false;go(1)}});
root.addEventListener('change',e=>{if(page===2&&e.target.name==='mode'){formState.mode=e.target.value;formState.setup=[false,false];formState.practiced=false;formState.switched=false;answers=[[],[]];render();main.querySelector('[name=mode]:checked')?.focus();return;}if(page===7){formState.switched=root.querySelector('#switch-eye').checked;root.querySelector('#next').disabled=!formState.switched;}if(page===1){formState.condition=root.querySelector('[name=condition]:checked')?.value??null;formState.consent=root.querySelector('#consent').checked}if(page===2){formState.setup=[...root.querySelectorAll('.setup')].map(c=>c.checked)}if(page===1){const s=root.querySelector('[name=condition]:checked');root.querySelector('#stop').hidden=!(s&&s.value==='yes');root.querySelector('#next').disabled=!(s&&s.value==='no'&&root.querySelector('#consent').checked)}if(page===2)root.querySelector('#next').disabled=!canEnter(6)});const heldKeys=new Set();
function handleKey(e){
  if(!solo()||e.ctrlKey||e.altKey||e.metaKey||e.shiftKey||e.isComposing||e.target?.matches('input,select,textarea,[contenteditable]'))return;
  const keys={ArrowUp:'atas',ArrowLeft:'kiri',ArrowRight:'kanan',ArrowDown:'bawah',n:'tidak terlihat'};
  const key=e.key.length===1?e.key.toLowerCase():e.key;
  if(!keys[key]&&key!=='p')return;
  if(page!==6&&!((page===3||page===4)&&ready))return;
  e.preventDefault();
  if(e.repeat||heldKeys.has(key))return;
  heldKeys.add(key);
  if(key==='p'){if(page!==6)main.querySelector('#pause')?.click();return;}
  if(paused)return;
  const selector=page===6?'[data-practice="'+keys[key]+'"]':'[data-answer="'+keys[key]+'"]';
  main.querySelector(selector)?.click();
}
document.addEventListener('keydown',handleKey);
document.addEventListener('keyup',e=>heldKeys.delete(e.key.length===1?e.key.toLowerCase():e.key));
window.addEventListener('blur',()=>heldKeys.clear());
render();})();
</script></body></html>
