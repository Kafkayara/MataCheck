name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source, preview and deployment configuration
        run: npm test
      - name: Validate browser test syntax and prepare fixture
        run: npm run test:browser:prepare
