name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source, preview and deployment configuration
        run: npm test
      - name: Run both modes in Chrome at five viewport sizes
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            tests/artifacts/browser-report.txt
            tests/artifacts/browser-stderr.txt
            tests/artifacts/browser-output.html
          if-no-files-found: warn
          retention-days: 7
